{% extends "admin/base_site.html" %}
{% block content %}
<div id="content-main">
    <div class="module" id="changelist">
        <table>
            <thead>
                <tr>
                    <th>{{ opts.verbose_name|capfirst }} Name</th>
                    <th>{{ statistics_header }}</th>
                </tr>
            </thead>
            <tbody>
                {% for item in results %}
                <tr class="{% cycle 'row1' 'row2' %}">
                    <td>{{ item.name }}</td>
                    <td>{{ item.statistics_count }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
